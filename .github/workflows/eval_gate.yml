name: Eval Gate

on:
  pull_request:
    branches: [main]

jobs:
  eval:
    name: RAGAS Evaluation Gate
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── 3. Dependencies ───────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Cache indexes (key = hash of all PDFs in data/) ────────────────
      - name: Cache FAISS + BM25 indexes
        id: cache-indexes
        uses: actions/cache@v4
        with:
          path: indexes/
          key: indexes-${{ hashFiles('data/**') }}

      # ── 5. Build indexes on cache miss ────────────────────────────────────
      - name: Build indexes (cache miss only)
        if: steps.cache-indexes.outputs.cache-hit != 'true'
        run: python -m src.ingestion.loader

      # ── 6. Run evaluation ─────────────────────────────────────────────────
      - name: Run RAGAS evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python evaluation/eval_runner.py

      # ── 7. Upload eval results as artifact ────────────────────────────────
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evaluation/eval_results.json
          retention-days: 30

      # ── 8. Post eval scores as PR comment ─────────────────────────────────
      - name: Post scores as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## FinScope AI — RAGAS Evaluation Results\n\n';

            try {
              const results = JSON.parse(
                fs.readFileSync('evaluation/eval_results.json', 'utf8')
              );
              const pass = (v, t) => v >= t ? '✅ PASS' : '❌ FAIL';
              body += `| Metric | Score | Status |\n`;
              body += `|--------|-------|--------|\n`;
              body += `| Faithfulness | ${results.faithfulness.toFixed(4)} | ${pass(results.faithfulness, 0.80)} |\n`;
              body += `| Answer Relevancy | ${results.answer_relevancy.toFixed(4)} | ${pass(results.answer_relevancy, 0.75)} |\n`;
              body += `| Context Recall | ${results.context_recall.toFixed(4)} | ${pass(results.context_recall, 0.70)} |\n`;
              body += `\n_Evaluated at ${results.timestamp}_`;
            } catch (e) {
              body += `⚠️ Could not read eval_results.json: ${e.message}`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
